<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الأستاذ الذكي | EduTunisia AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="ai-tutor.css" />
</head>
<body data-protected-role="student">
  <main class="tutor-shell">
    <aside class="tutor-sidebar glass">
      <a class="brand" href="/student/dashboard/" data-route="/student/dashboard">
        <span>AI</span>
        <strong>EduTunisia AI</strong>
      </a>
      <nav>
        <a href="/student/dashboard/" data-route="/student/dashboard">لوحة الطالب</a>
        <a href="/student/lessons/lesson-1/" data-route="/student/lessons/lesson-1">الدرس الحالي</a>
        <a href="/student/exercises/exercise-1/" data-route="/student/exercises/exercise-1">تمارين</a>
        <a href="/student/exams/" data-route="/student/exams">اختبار</a>
      </nav>
      <section class="context-card">
        <span>سياق المساعد</span>
        <strong data-context-title>محادثة عامة</strong>
        <p data-context-copy>يمكنك طرح أي سؤال دراسي وسيقترح الأستاذ الذكي شرحًا وتمارين مناسبة.</p>
      </section>
    </aside>

    <section class="chat-panel glass">
      <header>
        <div>
          <span class="eyebrow">AI Tutor</span>
          <h1>الأستاذ الذكي</h1>
        </div>
        <button type="button" data-route="/student/lessons/lesson-1">العودة للدرس</button>
      </header>

      <div class="chat-stream" data-chat-stream>
        <p class="ai-message">مرحبا، أنا أستاذك الذكي. أستطيع شرح الدرس، توليد تمرين، أو مراجعة إجابتك خطوة بخطوة.</p>
      </div>

      <form class="chat-form" data-chat-form>
        <input type="text" placeholder="اكتب سؤالك هنا..." aria-label="سؤال للأستاذ الذكي" />
        <button type="submit">إرسال</button>
      </form>
    </section>
  </main>

  <div class="toast" data-toast>تم إرسال السؤال</div>
  <script src="navigation.js"></script>
  <script src="ai-tutor.js"></script>
</body>
</html>
